##########################################################################
# Build KiCad on Ubuntu 20.04 and save the results
##########################################################################
name: Ubuntu 20.04 Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      include_tests:
        description: 'Include test artifacts'
        required: false
        type: boolean
        default: true

jobs:
  ubuntu-20-04-build:
    runs-on: ubuntu-latest-16-cores
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang \
            lld \
            ninja-build \
            ccache \
            libglm-dev \
            libboost-all-dev \
            libcurl4-openssl-dev \
            libcairo2-dev \
            libpixman-1-dev \
            libgit2-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfontconfig1-dev \
            libngspice0-dev \
            libocct-modeling-algorithms-dev \
            libocct-data-exchange-dev \
            libocct-visualization-dev \
            libprotobuf-dev \
            libpoppler-dev \
            libpoppler-glib-dev \
            libpoppler-cpp-dev \
            libspnav-dev \
            libsecret-1-dev \
            protobuf-compiler \
            libnng-dev \
            zlib1g-dev \
            libzstd-dev \
            libgtk-3-dev \
            libwxgtk3.2-dev \
            libwxgtk-media3.2-dev \
            libwxgtk-webview3.2-dev \
            wx3.2-headers \
            wx-common \
            unixodbc-dev \
            file

      - name: Create ccache directory
        run: mkdir -p ccache

      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: ccache/
          key: cache-ubuntu20.04-linux-${{ github.sha }}
          restore-keys: cache-ubuntu20.04-linux-

      - name: Configure ccache environment
        run: |
          export CCACHE_BASEDIR=${PWD}
          export CCACHE_DIR=${PWD}/ccache
          echo "CCACHE_BASEDIR=${PWD}" >> $GITHUB_ENV
          echo "CCACHE_DIR=${PWD}/ccache" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          mkdir -p build/linux
          cd build/linux
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"
          cmake \
            -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_LINKER_TYPE=LLD \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DKICAD_STDLIB_LIGHT_DEBUG=ON \
            -DKICAD_USE_OCC=ON \
            -DKICAD_BUILD_I18N=OFF \
            -DKICAD_BUILD_PNS_DEBUG_TOOL=ON \
            ../../

      - name: Build with Ninja
        run: |
          cd build/linux
          echo "Building with $(nproc) cores, going ahead!"
          ninja -j$(nproc) 2>&1 | tee compilation_log.txt

      - name: Debug - List build directory structure
        if: always()
        run: |
          echo "=== Build output structure ==="
          find build/linux -type f -executable -print0 | xargs -0 file | grep "ELF.*x86-64" | head -20
          echo ""
          echo "=== Looking for .kiface files ==="
          find build/linux -name "*.kiface" -type f
          echo ""
          echo "=== Looking for .so files ==="
          find build/linux -name "*.so*" -type f | grep -v ".so\." | head -20

      - name: Create binary directory structure
        run: |
          mkdir -p kicad-binaries/bin
          mkdir -p kicad-binaries/lib
          mkdir -p kicad-binaries/plugins
          mkdir -p kicad-binaries/resources

      - name: Collect all ELF x86-64 binaries
        run: |
          echo "=== Collecting ELF binaries ==="
          find build/linux -type f -executable | while read binary; do
            if file "$binary" | grep -q "ELF.*x86-64"; then
              echo "Found: $binary"
              cp "$binary" kicad-binaries/bin/ || true
            fi
          done
          ls -lah kicad-binaries/bin/

      - name: Collect plugin libraries (.kiface and .so files)
        run: |
          echo "=== Collecting plugin files (.kiface) ==="
          find build/linux -name "*.kiface" -type f | while read plugin; do
            echo "Found plugin: $plugin"
            cp "$plugin" kicad-binaries/plugins/ || true
          done
          
          echo "=== Collecting shared objects (.so) ==="
          find build/linux -name "*.so" -type f ! -name "*.so.*" | while read sofile; do
            if file "$sofile" | grep -q "ELF.*x86-64"; then
              echo "Found .so: $sofile"
              cp "$sofile" kicad-binaries/lib/ || true
            fi
          done
          
          echo "=== Collecting versioned .so files ==="
          find build/linux -name "*.so.*" -type f | while read sofile; do
            if file "$sofile" | grep -q "ELF.*x86-64"; then
              echo "Found .so.*: $sofile"
              cp "$sofile" kicad-binaries/lib/ || true
            fi
          done
          
          ls -lah kicad-binaries/plugins/
          ls -lah kicad-binaries/lib/

      - name: Collect data files and resources
        run: |
          echo "=== Collecting resources ==="
          for resdir in share resources 3d-models footprints; do
            if [ -d "build/linux/$resdir" ]; then
              echo "Copying $resdir..."
              cp -r "build/linux/$resdir" kicad-binaries/resources/ 2>/dev/null || true
            fi
          done
          
          if [ -d "build/linux/bin" ]; then
            echo "Copying remaining bin contents..."
            cp -r "build/linux/bin"/* kicad-binaries/resources/ 2>/dev/null || true
          fi

      - name: Verify collected binaries
        run: |
          echo "=== FINAL BINARY INVENTORY ==="
          echo ""
          echo "Executables in bin/:"
          file kicad-binaries/bin/* 2>/dev/null | grep ELF || echo "No ELF binaries found!"
          echo ""
          echo "Plugins in plugins/:"
          file kicad-binaries/plugins/* 2>/dev/null || echo "No plugins found!"
          echo ""
          echo "Libraries in lib/:"
          file kicad-binaries/lib/* 2>/dev/null | head -10 || echo "No libraries found!"
          echo ""
          echo "Total files collected:"
          find kicad-binaries -type f | wc -l

      - name: Create build info file
        run: |
          cat > kicad-binaries/BUILD_INFO.txt << 'EOF'
          KiCad Build Information
          ======================
          Build Date: $(date)
          Git Commit: ${{ github.sha }}
          Build Type: ${{ github.event.inputs.build_type || 'Release' }}
          Built by: zeankundev (CI)
          
          Directory Structure:
          - bin/: All ELF x86-64 executables (pcbnew, eeschema, kicad, cvpcb, gerbview, kicad2step, etc.)
          - lib/: Shared object libraries (.so, .so.*)
          - plugins/: Plugin files (.kiface)
          - resources/: Data files and resources
          
          Binary Inventory:
          EOF
          echo "" >> kicad-binaries/BUILD_INFO.txt
          echo "Binaries:" >> kicad-binaries/BUILD_INFO.txt
          file kicad-binaries/bin/* 2>/dev/null | grep -o '[^/]*$' >> kicad-binaries/BUILD_INFO.txt || true
          echo "" >> kicad-binaries/BUILD_INFO.txt
          echo "Total files: $(find kicad-binaries -type f | wc -l)" >> kicad-binaries/BUILD_INFO.txt

      - name: Create archive
        run: |
          cd kicad-binaries
          zip -r ../kicad-binaries-ubuntu20.04-${{ github.run_number }}.zip .
          cd ..
          ls -lh kicad-binaries-ubuntu20.04-*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-binaries-${{ github.sha }}
          path: |
            kicad-binaries-ubuntu20.04-*.zip
            build/linux/compilation_log.txt
            kicad-binaries/BUILD_INFO.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test artifacts (optional)
        uses: actions/upload-artifact@v4
        if: github.event.inputs.include_tests == 'true'
        with:
          name: kicad-tests-${{ github.sha }}
          path: build/linux/qa/
          retention-days: 30
          if-no-files-found: ignore